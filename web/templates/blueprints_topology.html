{% macro topology(kind, label) %}<svg class="topo topo-{{ kind }}" viewBox="0 0 320 120" role="img" aria-label="{{ label }} topology">

  <g class="edge"><path d="M86 60H118M202 60H234"/></g>
  <g class="node"><rect x="12" y="42" width="74" height="36" rx="8"/><rect x="123" y="42" width="74" height="36" rx="8"/><rect x="234" y="42" width="74" height="36" rx="8"/></g>
  <g class="label"><text x="49" y="64">Step 1</text><text x="160" y="64">Step 2</text><text x="271" y="64">Step 3</text></g>
  {% elif kind == "router" %}
  <g class="edge"><path d="M98 60C140 60 140 22 196 22M98 60H196M98 60C140 60 140 98 196 98"/></g>
  <g class="node"><rect x="18" y="42" width="80" height="36" rx="8" class="hub"/><rect x="196" y="6" width="106" height="32" rx="8"/><rect x="196" y="44" width="106" height="32" rx="8"/><rect x="196" y="82" width="106" height="32" rx="8"/></g>

  <g class="node"><rect x="24" y="42" width="100" height="36" rx="8"/><rect x="196" y="42" width="100" height="36" rx="8" class="hub"/></g>

  <g class="label"><text x="160" y="64">Agent</text><text x="47" y="26">Tool</text><text x="47" y="102">Tool</text><text x="273" y="26">Memory</text><text x="273" y="102">Tool</text></g>
  {% else %}

  <g class="label"><text x="56" y="64">Orchestrator</text><text x="203" y="26">Worker</text><text x="203" y="64">Worker</text><text x="203" y="102">Worker</text></g>
