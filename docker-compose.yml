services:
  web:
    build:
      context: .
      target: web
    env_file: .env
    environment:
      - DB_PATH=/data/blueprints.db
      - DATA_ROOT=/data/published
      - PLANETS=blueprints
      - TRUST_PROXY=1
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - default
      - ai
    labels:
      - traefik.enable=true
      - traefik.http.routers.blueprints.rule=Host(`${BLUEPRINTS_HOST:-blueprints.naveenlabs.tech}`)
      - traefik.http.routers.blueprints.entrypoints=websecure
      - traefik.http.routers.blueprints.tls.certresolver=letsencrypt
      - traefik.http.services.blueprints.loadbalancer.server.port=8000

  batch:
    build:
      context: .
      target: batch
    env_file:
      - .env
      - batch.env
    environment:
      - DB_PATH=/data/blueprints.db
      - DATA_ROOT=/data/published
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
    networks:
      - default
      - ai

networks:
  ai:
    external: true
    name: naveenlabs-ai_default

volumes:
  data:
